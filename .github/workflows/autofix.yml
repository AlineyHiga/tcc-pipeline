name: AutoFix SonarQube Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feat/autofix-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  autofix:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests with coverage
      run: |
        pytest -q --maxfail=1 --cov=src --cov-report=xml:coverage.xml
      continue-on-error: true
    
    - name: Run RAG ingestion
      run: |
        python -c "
        from app.rag.ingest import RAGIngestor
        from pathlib import Path
        ingestor = RAGIngestor()
        result = ingestor.ingest_directory(Path('.'))
        print(f'Indexed {result[\"docs_indexed\"]} documents')
        "
      continue-on-error: true
    
    - name: Run AutoFix Pipeline
      env:
        SONARQUBE_URL: ${{ secrets.SONARQUBE_URL }}
        SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
        SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        MAX_ROUNDS: 3
      run: |
        python -m app.main
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
      if: always()
    
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: reports/
      if: always()